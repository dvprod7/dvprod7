<footer class="footer">
  <div class="footer__inner">
    <p class="footer__brand">
      <span class="footer__logo"
        ><span aria-hidden="true">{{ content.brand.logo.open }}</span
        >{{ content.brand.logo.name
        }}<span aria-hidden="true">{{ content.brand.logo.close }}</span></span
      >{{ content.brand.suffix }}
    </p>
    <p class="footer__location">{{ content.location }}</p>
  </div>
</footer>
