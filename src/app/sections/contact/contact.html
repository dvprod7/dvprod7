<section class="contact" aria-labelledby="contact-title">
  <div class="contact__inner">
    <p class="contact__eyebrow"><span aria-hidden="true">/</span> {{ content.heading.eyebrow }}</p>

    <h2 id="contact-title" class="contact__title">{{ content.heading.title }}</h2>

    <p class="contact__body">{{ content.body }}</p>

    <div class="contact__actions">
      <app-button [href]="content.cta.href" variant="accent" size="sm">{{
        content.cta.label
      }}</app-button>

      <!-- One block: on mobile the pills wrap below the button together. -->
      <div class="contact__pills">
        @let copy = content.copyEmail;
        <app-copy-pill
          [label]="copy.label"
          [value]="copy.address"
          [fallbackHref]="copy.fallbackHref"
          [actionLabel]="copy.actionLabel"
          [copiedLabel]="copy.copiedLabel"
          [copiedAnnouncement]="copy.copiedAnnouncement"
        />

        <app-social-links [links]="socialLinks" variant="pill" [newTabHint]="newTabHint" />
      </div>
    </div>
  </div>
</section>
