<section class="hero" aria-labelledby="hero-title">
  <div class="hero__inner">
    <p class="hero__eyebrow"><span aria-hidden="true">/</span> {{ content.eyebrow }}</p>

    <h1 id="hero-title" class="hero__title">{{ content.title }}</h1>

    <p class="hero__lead">{{ content.lead }}</p>

    <div class="hero__ctas">
      @let primary = content.primaryCta;
      <app-button [href]="'#' + primary.sectionId" variant="cta"
        >{{ primary.label }}
        @if (primary.emoji) {
          <span aria-hidden="true">{{ primary.emoji }}</span>
        }
      </app-button>

      @let secondary = content.secondaryCta;
      <app-button [href]="'#' + secondary.sectionId" variant="outline"
        >{{ secondary.label }}
        @if (secondary.emoji) {
          <span aria-hidden="true">{{ secondary.emoji }}</span>
        }
      </app-button>
    </div>

    <app-social-links [links]="socialLinks" [newTabHint]="newTabHint" />
  </div>
</section>
