<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Title, description, canonical, Open Graph, Twitter card and JSON-LD come
         from the content layer (core/seo), baked in at prerender time. -->
    <title></title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Same value as --dv-color-bg (--dv-grey-800). -->
    <meta name="theme-color" content="#333333" />
    <!-- favicon.svg is the source; favicon.ico (16/32/48) and apple-touch-icon.png
         (180, full-bleed) are rendered from it. Colors: --dv-yellow-400 on --dv-grey-800. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/inter-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
